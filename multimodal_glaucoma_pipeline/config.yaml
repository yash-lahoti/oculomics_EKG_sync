# Multimodal Glaucoma AI Pipeline Configuration
# Unified config for OCTA VD, Fundus C/D, RNFL maps, visual function, and clinical parameters

project:
  name: "multimodal_glaucoma_ai"
  output_dir: "outputs"
  random_seed: 42

# Key column names for merging across modalities
keys:
  patient_id: "patient_id"
  eye: "eye"
  visit_date: "visit_date"

# Clinical/demographic data
clinical:
  path: "data/clinical.csv"
  group_col: "group"
  covariates:
    fixed:
      - "age"
      - "sex"
      - "iop"
      - "a1c"
    optional_fixed:
      - "sbp"
      - "dbp"
      - "htn_dx"
      - "moca"
  # Visual function outcomes - can be used as both covariates and outcomes
  visual_function:
    mesopic:
      - "va_logmar_mesopic"
    photopic:
      - "va_logmar_photopic"
    letter_score:
      - "va_letter_score"
    contrast_sensitivity:
      - "contrast_sensitivity_log"
  outcomes:
    primary_group: "group"
    glaucoma_label_value: "Glaucoma"
    control_label_value: "Control"
  glaucoma_only_cols:
    - "vf_md"
    - "diagnosis_subtype"

# Modality-specific configurations
modalities:
  # OCTA Vessel Density
  - name: "octa_vd"
    path: "data/octa_vd.csv"
    format: "wide"
    id_cols: ["patient_id", "eye", "visit_date", "slab", "region"]
    value_cols_regex: "^VD_"
    long_feature_col: "feature"
    long_value_col: "value"
    feature_namespace: "OCTA"
    qc:
      min_valid_fraction_per_patient_eye: 0.7
    aggregation:
      level: "patient_eye_visit"
      method: "mean"
    analysis:
      lmm:
        enabled: true
        random_effects: ["patient_id"]
        add_eye_as_fixed: true
        formula: "value ~ group + age + sex + iop + a1c"
      auroc:
        enabled: true
        method: "logreg"
      multiple_testing:
        method: "fdr_bh"

  # Fundus Cup-to-Disc
  - name: "fundus_cd"
    path: "data/fundus_cd.csv"
    format: "wide"
    id_cols: ["patient_id", "eye", "visit_date", "device", "quality_grade"]
    value_cols:
      - "pred_vcdr"
      - "pred_area_cdr"
      - "rim_area"
      - "disc_area"
      - "cup_area"
    feature_namespace: "FUNDUS"
    qc:
      quality_min: 2
      allowed_devices: []  # empty = allow all
    analysis:
      lmm:
        enabled: true
        random_effects: ["patient_id"]
        add_eye_as_fixed: true
        formula: "value ~ group + age + sex + iop + a1c + C(device) + quality_grade"
      reliability:
        enabled: true
        metric: "value"
        icc:
          by: ["patient_id", "eye"]
          rater: "device"
      auroc:
        enabled: true
      multiple_testing:
        method: "fdr_bh"

  # RNFL Thickness
  - name: "rnfl"
    path: "data/rnfl_map.csv"
    format: "wide"
    id_cols: ["patient_id", "eye", "visit_date"]
    value_cols_regex: "^rnfl_"
    feature_namespace: "RNFL"
    qc:
      plausible_range_um: [30, 200]
    aggregation:
      level: "patient_eye_visit"
      method: "mean"
    analysis:
      lmm:
        enabled: true
        random_effects: ["patient_id"]
        add_eye_as_fixed: true
        formula: "value ~ group + age + sex + iop + a1c"
      auroc:
        enabled: true
      multiple_testing:
        method: "fdr_bh"

# Outcome-based LMM models
# These models examine relationships between imaging features and visual function outcomes
outcome_models:
  enabled: true
  models:
    # Model 1: Effect of VD on mesopic visual acuity, stratified by glaucoma
    - name: "vd_mesopic_va"
      description: "OCTA Vessel Density effect on Mesopic Visual Acuity"
      outcome: "va_logmar_mesopic"
      predictor_modality: "octa_vd"
      predictor_features: ["VD_Global", "VD_ETDRS_Central", "VD_ETDRS_Superior", "VD_ETDRS_Inferior"]
      formula: "va_logmar_mesopic ~ predictor + group + predictor:group + age + sex + iop"
      random_effects: ["patient_id"]
      stratify_by_group: true

    # Model 2: Effect of VD on photopic visual acuity
    - name: "vd_photopic_va"
      description: "OCTA Vessel Density effect on Photopic Visual Acuity"
      outcome: "va_logmar_photopic"
      predictor_modality: "octa_vd"
      predictor_features: ["VD_Global", "VD_ETDRS_Central"]
      formula: "va_logmar_photopic ~ predictor + group + predictor:group + age + sex + iop"
      random_effects: ["patient_id"]
      stratify_by_group: true

    # Model 3: Effect of VD on contrast sensitivity
    - name: "vd_contrast_sensitivity"
      description: "OCTA Vessel Density effect on Contrast Sensitivity"
      outcome: "contrast_sensitivity_log"
      predictor_modality: "octa_vd"
      predictor_features: ["VD_Global", "VD_ETDRS_Central"]
      formula: "contrast_sensitivity_log ~ predictor + group + predictor:group + age + sex + iop"
      random_effects: ["patient_id"]
      stratify_by_group: true

    # Model 4: Effect of RNFL on mesopic VA
    - name: "rnfl_mesopic_va"
      description: "RNFL Thickness effect on Mesopic Visual Acuity"
      outcome: "va_logmar_mesopic"
      predictor_modality: "rnfl"
      predictor_features: ["rnfl_global", "rnfl_sup", "rnfl_inf"]
      formula: "va_logmar_mesopic ~ predictor + group + predictor:group + age + sex + iop"
      random_effects: ["patient_id"]
      stratify_by_group: true

    # Model 5: Effect of RNFL on photopic VA
    - name: "rnfl_photopic_va"
      description: "RNFL Thickness effect on Photopic Visual Acuity"
      outcome: "va_logmar_photopic"
      predictor_modality: "rnfl"
      predictor_features: ["rnfl_global", "rnfl_sup", "rnfl_inf"]
      formula: "va_logmar_photopic ~ predictor + group + predictor:group + age + sex + iop"
      random_effects: ["patient_id"]
      stratify_by_group: true

    # Model 6: Effect of RNFL on contrast sensitivity
    - name: "rnfl_contrast_sensitivity"
      description: "RNFL Thickness effect on Contrast Sensitivity"
      outcome: "contrast_sensitivity_log"
      predictor_modality: "rnfl"
      predictor_features: ["rnfl_global", "rnfl_sup", "rnfl_inf"]
      formula: "contrast_sensitivity_log ~ predictor + group + predictor:group + age + sex + iop"
      random_effects: ["patient_id"]
      stratify_by_group: true

    # Model 7: Effect of Fundus CDR on visual function
    - name: "cdr_mesopic_va"
      description: "Cup-to-Disc Ratio effect on Mesopic Visual Acuity"
      outcome: "va_logmar_mesopic"
      predictor_modality: "fundus_cd"
      predictor_features: ["pred_vcdr", "rim_area"]
      formula: "va_logmar_mesopic ~ predictor + group + predictor:group + age + sex + iop"
      random_effects: ["patient_id"]
      stratify_by_group: true

    # Model 8: VF MD as outcome (glaucoma patients only)
    - name: "vd_vf_md"
      description: "OCTA Vessel Density association with Visual Field MD (Glaucoma only)"
      outcome: "vf_md"
      predictor_modality: "octa_vd"
      predictor_features: ["VD_Global", "VD_ETDRS_Central", "VD_ETDRS_Superior", "VD_ETDRS_Inferior"]
      formula: "vf_md ~ predictor + age + sex + iop"
      random_effects: ["patient_id"]
      glaucoma_only: true
      stratify_by_group: false

    # Model 9: RNFL predicting VF MD (glaucoma only)
    - name: "rnfl_vf_md"
      description: "RNFL Thickness association with Visual Field MD (Glaucoma only)"
      outcome: "vf_md"
      predictor_modality: "rnfl"
      predictor_features: ["rnfl_global", "rnfl_sup", "rnfl_inf"]
      formula: "vf_md ~ predictor + age + sex + iop"
      random_effects: ["patient_id"]
      glaucoma_only: true
      stratify_by_group: false

# Table generation settings
tables:
  table1_demographics:
    enabled: true
    continuous: ["age", "iop", "a1c", "sbp", "dbp", "va_logmar_mesopic", "va_logmar_photopic", "contrast_sensitivity_log", "vf_md"]
    categorical: ["sex", "htn_dx", "diagnosis_subtype"]
  master_tables:
    enabled: true
    groupby:
      - "modality"
      - "category"
    sort_by:
      - "modality"
      - "category"
      - "p_fdr"

# Feature categorization rules (regex-based)
feature_categories:
  rules:
    - match: "^OCTA:VD_"
      category: "Vessel Density"
    - match: "^FUNDUS:pred_"
      category: "Cup-to-Disc"
    - match: "^FUNDUS:rim_"
      category: "Rim Metrics"
    - match: "^FUNDUS:disc_"
      category: "Disc Metrics"
    - match: "^FUNDUS:cup_"
      category: "Cup Metrics"
    - match: "^RNFL:rnfl_clock_"
      category: "Clock Hour"
    - match: "^RNFL:rnfl_global"
      category: "Global Thickness"
    - match: "^RNFL:rnfl_(sup|inf|temp|nasal)"
      category: "Quadrant Thickness"
    - match: "^RNFL:rnfl_"
      category: "Thickness Summary"

# Export settings
export:
  formats: ["csv", "parquet"]
